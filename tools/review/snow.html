<!doctype html><html lang="zh">
<script type="module" crossorigin src="../../assets/main-B2H2TBrO.js"></script>
<meta charset="utf-8"><title>Snow lab — 积雪分布 v1：旧规则 vs 新配方</title>
<style>body{background:#bfd9e2;margin:0;font:15px system-ui}canvas{display:block}nav{background:#fffffff0;border-radius:8px;width:318px;padding:14px 16px;position:absolute;top:16px;left:16px;box-shadow:0 2px 12px #00000026}nav b{font-size:16px}button{font:inherit;cursor:pointer;background:#f4f7f9;border:1px solid #bbb;border-radius:6px;margin:3px 2px;padding:5px 9px}button.on{color:#fff;background:#2b6cb0;border-color:#2b6cb0}label{color:#345;justify-content:space-between;align-items:center;margin:7px 0;font-size:13px;display:flex}label input{width:150px}label span{text-align:right;min-width:44px;font-family:monospace}output{white-space:pre-wrap;color:#234;margin:8px 0;font:12px/1.55 monospace;display:block}.hint{color:#567;font-size:12.5px;line-height:1.6}.row{margin:8px 0}</style>
<nav>
<b>积雪分布 v1 实验室</b><br>
<span class="hint">周边山脉（backdrop，真实 DEM）+ 中央雪场岛，游戏自己的 toon 渲染。旧版 = 只有坡度一个判据；新版 = 海拔雪线 + 坡度 + 凹凸 + 朝向加分制。</span>
<div class="row"><button id="m-old">旧规则</button><button id="m-new" class="on">新配方 v1</button></div>
<div class="row"><button data-preset="winter">严冬 1800</button><button data-preset="late">晚冬 2120</button><button data-preset="spring">残雪 2400</button></div>
<label>雪线基线 <input id="snowline" type="range" min="1700" max="2500" step="20" value="2120"><span id="snowline-v">2120m</span></label>
<label>朝向强度 <input id="aspect" type="range" min="0" max="400" step="10" value="200"><span id="aspect-v">200m</span></label>
<label>凹凸强度 <input id="concavity" type="range" min="0" max="1.5" step="0.05" value="0.85"><span id="concavity-v">0.85</span></label>
<label>坡度中心 <input id="slopeCenter" type="range" min="28" max="44" step="1" value="36"><span id="slopeCenter-v">36°</span></label>
<output id="stats">加载地形中…（40 km backdrop + 雪场岛，约几秒）</output>
<div class="hint">鼠标拖拽旋转 · 滚轮缩放 · 右键平移。滑杆只重算周边山脉（松手生效）；新旧切换会连雪场岛一起重算。看点：① 山顶这次有没有雪 ② 2100–2400 m 过渡带里雪是不是沿沟走、脊上露岩 ③ 谷底还白不白。<br>已知边界：顶点色一格 125 m，细雪沟出不来——那是 v2 烘焙贴图的事。</div>
</nav></html>
